name: FTP Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check document publication boundary
      run: python3 -m unittest discover -s tests

    - name: Verify FTPS hostname matches the existing deployment endpoint
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_TLS_HOST: plesk.librahost.fr
      run: |
        node <<'JS'
        const dns = require('node:dns').promises;
        (async () => {
          const [existing, tls] = await Promise.all([
            dns.lookup(process.env.FTP_SERVER, { all: true }),
            dns.lookup(process.env.FTP_TLS_HOST, { all: true }),
          ]);
          if (!existing.some(a => tls.some(b => a.address === b.address))) {
            throw new Error('The trusted FTPS hostname does not match the configured deployment endpoint');
          }
          console.log('FTPS endpoint verified; certificate verification remains mandatory');
        })().catch(() => { console.error('FTPS endpoint verification failed'); process.exitCode = 1; });
        JS

    - name: FTP Deployment
      uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
      with:
        protocol: ftps
        security: strict
        server: plesk.librahost.fr
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: "/"
        local-dir: ./
        dry-run: false
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          tests/**
          README.md
          docs/**
          package*.json
